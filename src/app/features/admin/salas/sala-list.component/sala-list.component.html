<a routerLink="/admin">← Volver</a>

<h2>Salas</h2>
<a routerLink="/admin/salas/nueva">Nueva sala</a>

@if (error()) {
    <small class="error">{{ error() }}</small>
}

@if (cargando()) {
    <app-spinner />
} @else {
<table>
    <thead>
        <tr>
            <th>Nombre</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        @for (sala of salas(); track sala.id) {
            <tr>
                <td>{{ sala.nombre }}</td>
                <td>
                    <button type="button" (click)="eliminar(sala)">Eliminar</button>
                </td>
            </tr>
        }
    </tbody>
</table>
}
