<a routerLink="/admin/salas">← Volver</a>

<form class="form" [formGroup]="formSala" (ngSubmit)="onSubmit()">
    <h2>Crear Sala</h2>

    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" formControlName="nombre">

    @if (error()) {
        <small class="error">{{ error() }}</small>
    }

    <button type="submit" [disabled]="enviado()">
        @if (enviado()) { <app-spinner [inline]="true" /> }
        Guardar
    </button>
</form>
