<a routerLink="/admin/productos">← Volver</a>

@if (cargando()) {
    <app-spinner />
} @else {
<form class="form" [formGroup]="formProducto" (ngSubmit)="onSubmit()">
    <h2>{{ idProducto ? 'Editar' : 'Crear' }} Producto</h2>

    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" formControlName="nombre">

    <label for="categoria_id">Categoría:</label>
    <select id="categoria_id" formControlName="categoria_id">
        <option value="">Sin categoría</option>
        @for (categoria of categoriasDisponibles(); track categoria.id) {
            <option [value]="categoria.id">{{ categoria.nombre }}</option>
        }
    </select>

    <label for="precio">Precio:</label>
    <input type="number" id="precio" step="0.01" formControlName="precio">

    <label for="imagen_url">Imagen (URL):</label>
    <input type="text" id="imagen_url" formControlName="imagen_url">

    <label>
        <input type="checkbox" formControlName="activo">
        Activo
    </label>

    @if (error()) {
        <small class="error">{{ error() }}</small>
    }

    <button type="submit" [disabled]="enviado()">
        @if (enviado()) { <app-spinner [inline]="true" /> }
        Guardar
    </button>
</form>
}
