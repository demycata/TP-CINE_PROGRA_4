<header class="header">
    <a routerLink="/" class="logo">
        <div class="flex items-center">
            <img src="https://cinehax.com/wp-content/themes/cinehax/assets/logo/logo_oficial.svg" alt="CINE HAX – Películas y Series GRATIS" class="h-6 w-auto -mt-1">
        </div>
    </a>

    <div class="flex-1"></div>

<!-- manejo de distinos nav segun la session -->
    <div class="acciones">
        @if (!auth.session()) {
            <a routerLink="/registro" routerLinkActive="activo" class="btn">Registrar</a>
            <a routerLink="/login" routerLinkActive="activo" class="btn">Login</a>
        } @else {
            <a *appSiRol="['empleado', 'admin']" routerLink="/validar" routerLinkActive="activo" class="btn">Validar</a>
            <a *appSiRol="'admin'" routerLink="/admin" routerLinkActive="activo" class="btn">Admin</a>
            <a *appSiRol="['cliente', 'empleado']" routerLink="/perfil" routerLinkActive="activo" class="btn"><svg class="w-[24px] h-[24px] text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
  <path fill-rule="evenodd" d="M12 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm-2 9a4 4 0 0 0-4 4v1a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-1a4 4 0 0 0-4-4h-4Z" clip-rule="evenodd"/>
</svg>
Perfil</a>
            <button type="button" class="btn" [disabled]="cerrandoSesion()" (click)="cerrarSesion()">
                @if (cerrandoSesion()) { <app-spinner [inline]="true" /> }
                <svg class="w-[24px] h-[24px] text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
  <path d="M13 21h6c1.1046 0 2-.8954 2-2V5c0-1.10457-.8954-2-2-2h-6v18Z"/>
  <path fill-rule="evenodd" d="M11 3H5c-1.10457 0-2 .89543-2 2v14c0 1.1046.89543 2 2 2h6V3Zm-2.29295 7.7071c.39052-.3905.39052-1.02368 0-1.41421-.39053-.39052-1.02369-.39052-1.41421 0L5.29289 11.2928c-.39052.3906-.39052 1.0237 0 1.4142l1.99995 2c.39052.3905 1.02368.3905 1.41421 0 .39052-.3905.39052-1.0237 0-1.4142l-1.29284-1.2929 1.29284-1.2928Z" clip-rule="evenodd"/>
</svg>
Cerrar sesión
            </button>
        }
    </div>
</header>
